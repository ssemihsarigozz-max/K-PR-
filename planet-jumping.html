  function roundedPoints(w,h,r){r=Math.min(r,w/2,h/2);const corners=[[w/2-r,-h/2+r,-Math.PI/2,0],[w/2-r,h/2-r,0,Math.PI/2],[-w/2+r,h/2-r,Math.PI/2,Math.PI],[-w/2+r,-h/2+r,Math.PI,Math.PI*1.5]],pts=[];for(const [cx,cy,a,b] of corners)for(let i=0;i<=10;i++){const t=a+(b-a)*i/10;pts.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r])}return pts}
  function project(x,y,cx,cy,rx,ry){const ax=rx*Math.PI/180,ay=ry*Math.PI/180,xx=x*Math.cos(ay),yy=y*Math.cos(ax),z=x*Math.sin(ay)-y*Math.sin(ax),p=850/(850+z);return[cx+xx*p,cy+yy*p]}
  function draw(now){const dt=Math.min(40,now-lastFrame);lastFrame=now;rotX+=(targetX-rotX)*Math.min(1,dt*.009);rotY+=(targetY-rotY)*Math.min(1,dt*.009);ctx.clearRect(0,0,innerWidth,innerHeight);if(frozen){ctx.drawImage(sceneCanvas,0,0,innerWidth,innerHeight);drawShade(ctx)}const rect=portal.getBoundingClientRect(),cx=rect.left+rect.width/2+(innerWidth/2-(rect.left+rect.width/2))*expansion,cy=rect.top+rect.height/2+(innerHeight/2-(rect.top+rect.height/2))*expansion,baseW=rect.width+(innerWidth-rect.width)*expansion,baseH=rect.height+(innerHeight-rect.height)*expansion,scale=expansion?1:maskScale,w=baseW*scale,h=baseH*scale,r=90*(1-expansion)*scale,rx=rotX*(1-expansion),ry=rotY*(1-expansion);if(w>1&&h>1){const pts=roundedPoints(w,h,r).map(([x,y])=>project(x,y,cx,cy,rx,ry));ctx.save();ctx.globalAlpha=canvasOpacity;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.clip();ctx.fillStyle='#030303';ctx.fillRect(0,0,innerWidth,innerHeight);const media=transitionActive?transitionVideo:(states[current].image?portalImage:portalVideo);drawCover(ctx,media);if(transitionActive)drawShade(ctx);ctx.restore()}requestAnimationFrame(draw)}
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function animateValue(setter,duration){return new Promise(resolve=>{const start=performance.now();function frame(now){const t=Math.min(1,(now-start)/duration);setter(ease(t));t<1?requestAnimationFrame(frame):resolve()}requestAnimationFrame(frame)})}
  function mediaReady(media){return new Promise(resolve=>{if((media.readyState||0)>=2||(media.complete&&media.naturalWidth))return resolve();const done=()=>resolve();media.addEventListener('canplay',{once:true});media.addEventListener('load',done,{once:true});media.addEventListener('error',done,{once:true});setTimeout(done,1800)})}
  function revealMask(){experience.classList.remove('mask-revealing');void experience.offsetWidth;experience.classList.add('mask-revealing');maskScale=0;return animateValue(v=>maskScale=v,1050)}
  function revealPlanetContent(){experience.classList.remove('content-revealing');void experience.offsetWidth;experience.classList.add('content-revealing')}
  async function startExperience(){await mediaReady(states[current].image?portalImage:portalVideo);await revealMask();document.body.classList.add('intro-ready');setTimeout(revealPlanetContent,850);q('#mars-background').play().catch(()=>{})}
  function runPreloader(){const video=q('#preloader-video'),value=q('#preloader-value');let finished=false;const finish=()=>{if(finished)return;finished=true;value.textContent='100';q('#preloader-count').classList.add('is-leaving');q('#floating-logo').classList.add('is-docked');q('#preloader').classList.add('is-background');document.body.classList.add('preload-complete');startExperience();setTimeout(()=>q('#preloader-count').remove(),750);setTimeout(()=>q('#floating-logo').classList.add('is-settled'),2000)};const progress=()=>{if(finished)return;value.textContent=String(Math.round((video.currentTime/(video.duration||1))*100));requestAnimationFrame(progress)};const play=()=>{video.playbackRate=Math.max(.25,(video.duration||.75)/3);video.play().then(()=>requestAnimationFrame(progress)).catch(finish)};video.addEventListener('loadedmetadata',play,{once:true});video.addEventListener('ended',finish,{once:true});video.addEventListener('error',()=>setTimeout(finish,500),{once:true});if(video.readyState>=1)play();setTimeout(finish,5200)}
  async function travel(){if(busy||current==='avalanche')return;busy=true;targetX=targetY=0;const next=current==='okx'?'binance':'avalanche';try{transitionVideo.src=states[current].portal;transitionVideo.load();experience.classList.add('is-loading');await new Promise(resolve=>{const done=()=>resolve();transitionVideo.addEventListener('canplaythrough',done,{once:true});transitionVideo.addEventListener('error',done,{once:true});setTimeout(done,1600)});experience.classList.remove('is-loading','content-revealing','mask-revealing');experience.classList.add('is-transitioning');transitionVideo.currentTime=0;transitionVideo.playbackRate=1.3;canvasOpacity=1;transitionActive=true;transitionVideo.play().catch(()=>{});await animateValue(v=>expansion=v,1100);await new Promise(resolve=>{if(transitionVideo.ended)return resolve();transitionVideo.addEventListener('ended',resolve,{once:true});setTimeout(resolve,6000)});frozen=false;resizeCanvas();sceneCtx.clearRect(0,0,innerWidth,innerHeight);drawCover(sceneCtx,transitionVideo);frozen=true;current=next;experience.classList.add('is-committing');render();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));transitionActive=false;expansion=0;maskScale=0;experience.classList.remove('is-transitioning','is-committing');const reveal=revealMask();setTimeout(revealPlanetContent,100);await reveal;setTimeout(()=>{transitionVideo.removeAttribute('src');transitionVideo.load();busy=false},450)}catch(e){transitionActive=false;expansion=0;maskScale=1;canvasOpacity=1;experience.classList.remove('is-transitioning','is-committing','is-loading');busy=false}}
  async function hydrateMarketData(){try{const response=await fetch('/api/opportunities?budgetTry=1000&maxPremiumPct=0.8'),data=await response.json();if(!response.ok)return;const byId=Object.fromEntries(data.venues.map(v=>[v.id,v])),money=value=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(value);states.okx.facts[0][1]=`BTC/TRY · ${money(byId['okx-tr'].rawPriceTry)} · LIVE via OKX Agent Trade Kit.`;states.okx.facts[1][1]=`OKX Global normalized reference · ${money(data.referenceTry)}.`;states.binance.facts[0][1]=`MOCK quote · ${money(byId.binance.rawPriceTry)} · derived from live OKX reference.`;states.avalanche.facts[0][1]=`Trader Joe on Avalanche · ${money(byId['trader-joe'].rawPriceTry)} · MOCK.`;q('#market-status').textContent=`${data.coverage.live} LIVE / ${data.coverage.mock} MOCK`;render()}catch(e){q('#market-status').textContent='Market feed unavailable'}}
  portal.addEventListener('click',travel);portal.addEventListener('pointerenter',()=>cursor.classList.add('is-enter'));portal.addEventListener('pointerleave',()=>cursor.classList.remove('is-enter'));addEventListener('pointermove',e=>{pointerX=e.clientX;pointerY=e.clientY;cursor.classList.add('is-visible');if(!busy&&e.pointerType!=='touch'){targetY=(e.clientX/innerWidth-.5)*37.4;targetX=(e.clientY/innerHeight-.5)*-33}});document.addEventListener('mouseleave',()=>{cursor.classList.remove('is-visible');targetX=targetY=0});function cursorLoop(){cursorX+=(pointerX-cursorX)*.2;cursorY+=(pointerY-cursorY)*.2;cursor.style.transform=`translate3d(${cursorX}px,${cursorY}px,0)`;requestAnimationFrame(cursorLoop)}
  addEventListener('resize',resizeCanvas);document.querySelectorAll('.background').forEach(v=>{v.pause();v.currentTime=0});resizeCanvas();render();hydrateMarketData();requestAnimationFrame(draw);requestAnimationFrame(cursorLoop);runPreloader();
</script>
